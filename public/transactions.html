<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Transactions - Personal Finance Tracker</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="app-body">
  <div class="app-layout">
    <aside class="sidebar"><div data-nav></div></aside>
    <main class="content">
      <header class="topbar">
        <div><h1>Transactions</h1><p class="muted">Add, filter and manage your income and expenses.</p></div>
        <button class="btn btn-primary" id="addTxBtn">+ Add transaction</button>
      </header>

      <section class="card">
        <div class="filters">
          <select id="filterType" class="input input-sm">
            <option value="">All types</option>
            <option value="income">Income</option>
            <option value="expense">Expense</option>
          </select>
          <select id="filterCategory" class="input input-sm"></select>
          <input type="date" id="filterFrom" class="input input-sm" />
          <span class="muted">to</span>
          <input type="date" id="filterTo" class="input input-sm" />
          <button class="btn btn-outline btn-sm" id="filterBtn">Apply filters</button>
          <button class="btn btn-ghost btn-sm" id="clearBtn">Clear</button>
        </div>
      </section>

      <section class="card">
        <div class="card-head"><h3>Records</h3><span id="txCount" class="muted"></span></div>
        <div id="txTableWrap" class="table-wrap"></div>
        <div class="pagination" id="pagination"></div>
      </section>
    </main>
  </div>

  <div class="modal hidden" id="txModal">
    <div class="modal-box">
      <div class="modal-head"><h3 id="modalTitle">Add transaction</h3><button class="modal-close" id="modalClose">&times;</button></div>
      <form id="txForm">
        <input type="hidden" id="txId" />
        <div class="form-group">
          <label>Type</label>
          <select id="txType" class="input" required>
            <option value="expense">Expense</option>
            <option value="income">Income</option>
          </select>
        </div>
        <div class="form-group">
          <label>Amount</label>
          <input type="number" id="txAmount" class="input" min="0.01" step="0.01" required placeholder="0.00" />
        </div>
        <div class="form-group">
          <label>Category</label>
          <select id="txCategory" class="input" required></select>
        </div>
        <div class="form-group">
          <label>Date</label>
          <input type="date" id="txDate" class="input" required />
        </div>
        <div class="form-group">
          <label>Description</label>
          <input type="text" id="txDescription" class="input" placeholder="Optional note" />
        </div>
        <div class="modal-actions">
          <button type="button" class="btn btn-outline" id="modalCancel">Cancel</button>
          <button type="submit" class="btn btn-primary">Save</button>
        </div>
      </form>
    </div>
  </div>

  <script src="js/app.js"></script>
  <script src="js/demo.js"></script>
  <script src="js/transactions.js"></script>
</body>
</html>
