<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Budgets - Personal Finance Tracker</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="app-body">
  <div class="app-layout">
    <aside class="sidebar"><div data-nav></div></aside>
    <main class="content">
      <header class="topbar">
        <div><h1>Monthly Budgets</h1><p class="muted">Set category limits and track spending.</p></div>
        <button class="btn btn-primary" id="addBudgetBtn">+ New budget</button>
      </header>

      <section class="card">
        <div class="filters">
          <label class="control-label">Month</label>
          <select id="budgetMonth" class="input input-sm"></select>
          <span class="muted" id="budgetSummary"></span>
        </div>
      </section>

      <section class="card">
        <div id="budgetList" class="list"></div>
      </section>
    </main>
  </div>

  <div class="modal hidden" id="budgetModal">
    <div class="modal-box">
      <div class="modal-head"><h3 id="modalTitle">Add budget</h3><button class="modal-close" id="modalClose">&times;</button></div>
      <form id="budgetForm">
        <input type="hidden" id="budgetId" />
        <div class="form-group">
          <label>Category</label>
          <select id="budgetCategory" class="input" required></select>
        </div>
        <div class="form-group">
          <label>Monthly limit</label>
          <input type="number" id="budgetAmount" class="input" min="1" step="0.01" required placeholder="0.00" />
        </div>
        <div class="form-group">
          <label>Note</label>
          <input type="text" id="budgetNote" class="input" placeholder="Optional" />
        </div>
        <div class="modal-actions">
          <button type="button" class="btn btn-outline" id="modalCancel">Cancel</button>
          <button type="submit" class="btn btn-primary">Save</button>
        </div>
      </form>
    </div>
  </div>

  <script src="js/app.js"></script>
  <script src="js/demo.js"></script>
  <script src="js/budgets.js"></script>
</body>
</html>
