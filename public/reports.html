<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reports - Personal Finance Tracker</title>
  <link rel="stylesheet" href="css/style.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
</head>
<body class="app-body">
  <div class="app-layout">
    <aside class="sidebar"><div data-nav></div></aside>
    <main class="content">
      <header class="topbar">
        <div><h1>Reports &amp; Analytics</h1><p class="muted">Interactive charts and financial reports.</p></div>
        <div class="topbar-actions">
          <button class="btn btn-outline" id="exportBtn">&#11015; Export CSV</button>
        </div>
      </header>

      <section class="card">
        <div class="filters">
          <label class="control-label">Month</label>
          <select id="reportMonth" class="input input-sm"></select>
          <label class="control-label">Category view</label>
          <select id="reportType" class="input input-sm">
            <option value="expense">Expenses</option>
            <option value="income">Income</option>
            <option value="all">All</option>
          </select>
          <label class="control-label">Trend window</label>
          <select id="trendDays" class="input input-sm">
            <option value="30">Last 30 days</option>
            <option value="90">Last 90 days</option>
          </select>
        </div>
      </section>

      <section class="stat-grid" id="reportStats"></section>

      <section class="card-row">
        <div class="card">
          <div class="card-head"><h3>Category breakdown</h3></div>
          <div id="categoryList" class="list"></div>
        </div>
        <div class="card">
          <div class="card-head"><h3>Spending by category</h3></div>
          <div class="chart-wrap"><canvas id="categoryChart"></canvas></div>
        </div>
      </section>

      <section class="card">
        <div class="card-head"><h3>Daily income vs expense</h3></div>
        <div class="chart-wrap chart-tall"><canvas id="trendChart"></canvas></div>
      </section>

      <section class="card">
        <div class="card-head"><h3>Monthly comparison</h3></div>
        <div class="chart-wrap chart-tall"><canvas id="comparisonChart"></canvas></div>
      </section>
    </main>
  </div>

  <script src="js/app.js"></script>
  <script src="js/demo.js"></script>
  <script src="js/reports.js"></script>
</body>
</html>
