<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create account - Personal Finance Tracker</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="auth-body">
  <div class="auth-card">
    <div class="auth-brand">&#128176; FinanceTracker</div>
    <h1>Create your account</h1>
    <p class="auth-sub">Start tracking your money today.</p>

    <div id="alertBox" class="alert hidden"></div>

    <form id="registerForm">
      <div class="form-group">
        <label for="name">Full name</label>
        <input type="text" id="name" required placeholder="Jane Doe" />
      </div>
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" required placeholder="you@example.com" />
      </div>
      <div class="form-group">
        <label for="password">Password (min 6 characters)</label>
        <input type="password" id="password" required minlength="6" placeholder="Choose a strong password" />
      </div>
      <button type="submit" class="btn btn-primary btn-block">Create account</button>
    </form>

    <p class="auth-alt">Already have an account? <a href="login.html">Log in</a></p>
    <a href="index.html" class="auth-back">&larr; Back to home</a>
  </div>

  <script src="js/app.js"></script>
  <script src="js/demo.js"></script>
  <script>
    if (App.isLoggedIn()) window.location.href = 'dashboard.html';
    const box = document.getElementById('alertBox');
    function show(msg, ok) { box.textContent = msg; box.className = 'alert ' + (ok ? 'alert-success' : 'alert-error'); }
    document.getElementById('registerForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = e.target.querySelector('button');
      btn.disabled = true;
      try {
        const data = await App.api('/auth/register', {
          method: 'POST',
          body: JSON.stringify({
            name: document.getElementById('name').value,
            email: document.getElementById('email').value,
            password: document.getElementById('password').value,
          }),
        });
        App.login(data.token, data.user);
        window.location.href = 'dashboard.html';
      } catch (err) {
        show(err.message, false);
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
