<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Panel - Personal Finance Tracker</title>
  <link rel="stylesheet" href="css/style.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
</head>
<body class="app-body">
  <div class="app-layout">
    <aside class="sidebar"><div data-nav></div></aside>
    <main class="content">
      <header class="topbar">
        <div><h1>Admin Panel</h1><p class="muted">Manage users and website data.</p></div>
      </header>

      <section class="stat-grid" id="adminStats"></section>

      <section class="card">
        <div class="card-head">
          <h3>Users</h3>
          <div class="filters">
            <input type="text" id="userSearch" class="input input-sm" placeholder="Search name or email..." />
            <button class="btn btn-outline btn-sm" id="searchBtn">Search</button>
          </div>
        </div>
        <div id="userListWrap" class="table-wrap"></div>
        <div class="pagination" id="userPagination"></div>
      </section>
    </main>
  </div>

  <div class="modal hidden" id="userModal">
    <div class="modal-box modal-lg">
      <div class="modal-head"><h3 id="userModalTitle">User details</h3><button class="modal-close" id="userModalClose">&times;</button></div>
      <div id="userDetailBody"></div>
      <div class="modal-actions" id="userModalActions"></div>
    </div>
  </div>

  <div class="modal hidden" id="editUserModal">
    <div class="modal-box">
      <div class="modal-head"><h3>Edit user</h3><button class="modal-close" id="editUserClose">&times;</button></div>
      <form id="editUserForm">
        <input type="hidden" id="editUserId" />
        <div class="form-group">
          <label>Name</label>
          <input type="text" id="editName" class="input" required />
        </div>
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="editEmail" class="input" required />
        </div>
        <div class="form-group">
          <label>Role</label>
          <select id="editRole" class="input">
            <option value="user">User</option>
            <option value="admin">Admin</option>
          </select>
        </div>
        <div class="form-group">
          <label>Currency</label>
          <input type="text" id="editCurrency" class="input" placeholder="USD" />
        </div>
        <div class="form-group">
          <label>New password (leave blank to keep)</label>
          <input type="password" id="editPassword" class="input" minlength="6" placeholder="Min 6 characters" />
        </div>
        <div class="modal-actions">
          <button type="button" class="btn btn-outline" id="editUserCancel">Cancel</button>
          <button type="submit" class="btn btn-primary">Save changes</button>
        </div>
      </form>
    </div>
  </div>

  <script src="js/app.js"></script>
  <script src="js/demo.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
